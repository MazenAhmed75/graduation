org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC
android.useAndroidX=true

# Stabilize the Kotlin compiler and avoid daemon crashes
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -Dfile.encoding=UTF-8
kotlin.incremental=false
kotlin.daemon.jvm.options=-Xmx4096m -XX:+UseParallelGC
